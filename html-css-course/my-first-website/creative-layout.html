<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bố cục Mosaic sáng tạo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="creative-grid-demo">
  <main class="creative-page">
    <header class="creative-heading">
      <p class="eyebrow">BỘ SƯU TẬP 2026</p>
      <h1>Những khoảng lặng</h1>
      <p>Một bố cục mosaic dùng CSS Grid để tạo nhịp điệu bất đối xứng.</p>
    </header>
    <section class="creative-grid" aria-label="Bộ sưu tập sáu mảng màu">
      <article class="creative-tile creative-tile-1"><span>01</span><h2>Ánh sáng</h2><p>Mở đầu bằng một khối lớn, tạo điểm nhìn chính.</p></article>
      <article class="creative-tile creative-tile-2"><span>02</span><h2>Nhịp điệu</h2></article>
      <article class="creative-tile creative-tile-3"><span>03</span><h2>Sắc xanh</h2><p>Khối này trải ngang hai cột.</p></article>
      <article class="creative-tile creative-tile-4"><span>04</span><h2>Chiều sâu</h2><p>Khối cao nối hai hàng.</p></article>
      <article class="creative-tile creative-tile-5"><span>05</span><h2>Khoảng trống</h2></article>
      <article class="creative-tile creative-tile-6"><span>06</span><h2>Cân bằng</h2></article>
    </section>
  </main>
</body>
</html>
