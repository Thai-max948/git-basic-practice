<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thí nghiệm Block và Inline</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="display-test">
    <h1>Thí nghiệm Block vs. Inline</h1>
    <h2>Phần tử Block (dùng div)</h2>
    <div class="box block-box">Block 1</div>
    <div class="box block-box">Block 2</div>
    <hr>
    <h2>Phần tử Inline (dùng span)</h2>
    <p>Đây là một đoạn văn bản chứa <span class="box inline-box">Inline 1</span> và <span class="box inline-box">Inline 2</span> để so sánh.</p>
  </main>
</body>
</html>
