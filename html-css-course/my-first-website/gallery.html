<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thư viện ảnh du lịch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="gallery-demo">
  <main class="gallery-page">
    <h1>Những điểm đến đáng nhớ</h1>
    <p class="gallery-intro">Một vài khung cảnh từ những chuyến đi qua Việt Nam.</p>
    <div class="gallery-container">
      <figure class="gallery-item"><img src="https://picsum.photos/seed/hoian-lanterns/800/600" alt="Khung cảnh phố cổ Hội An lúc chiều tà" loading="lazy"><figcaption>Phố cổ Hội An</figcaption></figure>
      <figure class="gallery-item"><img src="https://picsum.photos/seed/halong-bay/800/600" alt="Vịnh biển với những đảo đá xanh" loading="lazy"><figcaption>Vịnh biển</figcaption></figure>
      <figure class="gallery-item"><img src="https://picsum.photos/seed/sapa-mountains/800/600" alt="Dãy núi mờ sương ở vùng cao" loading="lazy"><figcaption>Núi rừng phía Bắc</figcaption></figure>
      <figure class="gallery-item"><img src="https://picsum.photos/seed/dalat-pines/800/600" alt="Rừng thông xanh bên hồ" loading="lazy"><figcaption>Rừng thông</figcaption></figure>
      <figure class="gallery-item"><img src="https://picsum.photos/seed/mekong-river/800/600" alt="Dòng sông miền Tây dưới nắng sớm" loading="lazy"><figcaption>Sông miền Tây</figcaption></figure>
      <figure class="gallery-item"><img src="https://picsum.photos/seed/central-beach/800/600" alt="Bãi biển miền Trung và những con sóng" loading="lazy"><figcaption>Bãi biển miền Trung</figcaption></figure>
      <figure class="gallery-item"><img src="https://picsum.photos/seed/hue-citadel/800/600" alt="Một công trình kiến trúc cổ ở Huế" loading="lazy"><figcaption>Cố đô Huế</figcaption></figure>
      <figure class="gallery-item"><img src="https://picsum.photos/seed/rice-fields/800/600" alt="Ruộng bậc thang xanh trên sườn núi" loading="lazy"><figcaption>Ruộng bậc thang</figcaption></figure>
    </div>
  </main>
</body>
</html>
